document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,1);will-change:transform\">\n          <div style=\"font:600 10px/1 'Geist Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ae-acc,#8b7cf6)\">{{ p.n }}<\u002Fdiv>\n          <div style=\"margin-top:12px;font:600 15.5px/1.3 Geist,sans-serif;letter-spacing:-.01em\">{{ p.t }}<\u002Fdiv>\n          <p style=\"margin:8px 0 0;font:300 13.5px/1.6 Geist,sans-serif;color:var(--ae-t2,rgba(255,255,255,.62));text-wrap:pretty\">{{ p.b }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"format\" style=\"position:relative;z-index:1;padding:0 clamp(16px,4vw,34px) clamp(80px,12vw,120px)\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:clamp(26px,5vw,52px);border-radius:22px;border:1px solid var(--ae-line,rgba(255,255,255,.10));background:var(--ae-surf,#0e0e14);transition:background-color .7s ease,border-color .7s ease\">\n    <div data-rv=\"\" style=\"font:500 9.5px/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ae-acc,#8b7cf6)\">04 — The contract<\u002Fdiv>\n    <h2 data-rv=\"\" data-d=\"70\" style=\"margin:16px 0 0;max-width:24ch;font:600 clamp(30px,3.6vw,46px)/1.06 'Bricolage Grotesque',Geist,sans-serif;letter-spacing:-.03em\">A skin cannot break the app. That's a property of the format, not a promise.<\u002Fh2>\n    <div style=\"margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px\">\n      <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div data-rv=\"\">\n          <div data-count=\"{{ s.n }}\" style=\"font:600 clamp(40px,4.6vw,58px)/1 'Bricolage Grotesque',Geist,sans-serif;letter-spacing:-.04em;color:var(--ae-acc,#8b7cf6);transition:color .7s ease\">0<\u002Fdiv>\n          <div style=\"margin-top:8px;font:550 13px/1.35 Geist,sans-serif\">{{ s.t }}<\u002Fdiv>\n          <div style=\"margin-top:5px;font:300 12.5px/1.55 Geist,sans-serif;color:var(--ae-t2,rgba(255,255,255,.62))\">{{ s.b }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"roadmap\" style=\"position:relative;z-index:1;padding:0 clamp(16px,4vw,34px) clamp(84px,13vw,130px)\">\n  <div style=\"max-width:1180px;margin:0 auto\">\n    <div data-rv=\"\" style=\"font:500 9.5px/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ae-acc,#8b7cf6)\">05 — Roadmap<\u002Fdiv>\n    <div data-stack=\"\" data-cols=\"1fr minmax(280px,400px)\" style=\"margin-top:18px;display:grid;grid-template-columns:1fr minmax(280px,400px);gap:clamp(18px,3vw,46px);align-items:end\">\n      <h2 data-rv=\"\" data-d=\"70\" style=\"margin:0;max-width:20ch;font:600 clamp(34px,4.4vw,58px)/1.03 'Bricolage Grotesque',Geist,sans-serif;letter-spacing:-.035em\">What isn't there yet, and why.<\u002Fh2>\n      <p data-rv=\"\" data-d=\"130\" style=\"margin:0;font:300 15px/1.65 Geist,sans-serif;color:var(--ae-t2,rgba(255,255,255,.62));text-wrap:pretty\">Nine of the 48 registered parts don't render today. They stay in the registry so that skins written now still fit the app later.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:46px;display:flex;flex-direction:column\">\n      <sc-for list=\"{{ roadmap }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div data-rv=\"\" data-road=\"\" data-stack=\"\" data-cols=\"112px 1fr auto\" style=\"display:grid;grid-template-columns:112px 1fr auto;gap:clamp(8px,2vw,26px);align-items:baseline;padding:22px 6px;border-top:1px solid var(--ae-line,rgba(255,255,255,.08));transition:background-color .3s ease,border-color .7s ease,padding-left .3s ease\">\n          <span style=\"font:500 10.5px/1 'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:{{ r.sc }}\">{{ r.s }}<\u002Fspan>\n          <div>\n            <div style=\"font:550 17px/1.3 Geist,sans-serif;letter-spacing:-.01em\">{{ r.t }}<\u002Fdiv>\n            <p style=\"margin:7px 0 0;max-width:74ch;font:300 13.5px/1.6 Geist,sans-serif;color:var(--ae-t2,rgba(255,255,255,.62));text-wrap:pretty\">{{ r.b }}<\u002Fp>\n          <\u002Fdiv>\n          <span style=\"font:10.5px 'Geist Mono',monospace;color:var(--ae-t3,rgba(255,255,255,.46));white-space:nowrap\">{{ r.p }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"border-top:1px solid var(--ae-line,rgba(255,255,255,.08))\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"access\" style=\"position:relative;z-index:1;padding:0 clamp(16px,4vw,34px) clamp(80px,12vw,120px)\">\n  <div data-rv=\"\" style=\"position:relative;max-width:1180px;margin:0 auto;padding:clamp(44px,8vw,70px) clamp(20px,5vw,52px);border-radius:24px;overflow:hidden;border:1px solid var(--ae-line,rgba(255,255,255,.12));background:var(--ae-surf,#0e0e14);text-align:center;transition:background-color .7s ease,border-color .7s ease\">\n    <div style=\"position:absolute;inset:-40% -10% auto;height:120%;background:radial-gradient(60% 60% at 50% 0%,var(--ae-glowA,rgba(139,124,246,.30)),transparent 70%);animation:ae-drift 18s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative\">\n      <svg width=\"30\" height=\"30\" style=\"color:var(--ae-acc,#8b7cf6)\"><use href=\"#a-mark\"><\u002Fuse><\u002Fsvg>\n      <h2 style=\"margin:22px auto 0;max-width:17ch;font:600 clamp(32px,4.2vw,54px)/1.04 'Bricolage Grotesque',Geist,sans-serif;letter-spacing:-.035em\">Early access opens in waves. Get in the first one.<\u002Fh2>\n      <p style=\"margin:16px auto 0;max-width:52ch;font:300 15.5px/1.62 Geist,sans-serif;color:var(--ae-t2,rgba(255,255,255,.62));text-wrap:pretty\">Builds for macOS, Windows and Linux, plus the skin format spec and the studio while it's still rough enough to argue with. Everything ships from github.com/FedericoBaratti/Aether.<\u002Fp>\n      <form data-form=\"\" data-formrow=\"\" style=\"margin:32px auto 0;display:flex;gap:9px;max-width:470px\">\n        <input data-email=\"\" type=\"email\" placeholder=\"you@domain.com\" style=\"flex:1;height:50px;padding:0 18px;border-radius:99px;border:1px solid var(--ae-line,rgba(255,255,255,.14));background:var(--ae-bg,#09090d);color:var(--ae-t1,rgba(255,255,255,.94));font:15px Geist,sans-serif;outline:none;transition:border-color .3s ease,background-color .7s ease\">\n        <button data-submit=\"\" type=\"submit\" style=\"height:50px;padding:0 24px;border:0;border-radius:99px;background:var(--ae-acc,#8b7cf6);color:var(--ae-ink,#09090d);font:600 14.5px Geist,sans-serif;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .7s ease\">Join the list<\u002Fbutton>\n      <\u002Fform>\n      <div data-formnote=\"\" style=\"margin:14px 0 0;font:11.5px 'Geist Mono',monospace;color:var(--ae-t3,rgba(255,255,255,.46))\">One email when your wave opens. Nothing else, ever.<\u002Fdiv>\n      <div style=\"margin:30px 0 0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap\">\n        <a href=\"https://github.com/FedericoBaratti/Aether\" target=\"_blank\" rel=\"noopener\" data-magnet=\"\" style=\"display:flex;align-items:center;gap:9px;height:42px;padding:0 20px;border-radius:99px;border:1px solid var(--ae-line,rgba(255,255,255,.14));color:var(--ae-t1,rgba(255,255,255,.94));font:550 13.5px/1 Geist,sans-serif;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .3s ease\">\n          <svg width=\"15\" height=\"15\" style=\"color:var(--ae-acc,#8b7cf6)\"><use href=\"#a-star\"><\u002Fuse><\u002Fsvg>Star on GitHub<span style=\"font:11px 'Geist Mono',monospace;color:var(--ae-t3,rgba(255,255,255,.46))\">FedericoBaratti/Aether<\u002Fspan>\n        <\u002Fa>\n        <a href=\"#format\" style=\"display:flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:99px;color:var(--ae-t2,rgba(255,255,255,.62));font:500 13.5px/1 Geist,sans-serif\">Read the skin spec<svg width=\"14\" height=\"14\"><use href=\"#a-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"position:relative;z-index:1;padding:30px clamp(16px,4vw,34px) 44px;border-top:1px solid var(--ae-line,rgba(255,255,255,.08));transition:border-color .7s ease\">\n  <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:center\">\n    <div style=\"display:flex;align-items:center;gap:9px\"><svg width=\"17\" height=\"17\" style=\"color:var(--ae-acc,#8b7cf6)\"><use href=\"#a-mark\"><\u002Fuse><\u002Fsvg><span style=\"font:600 13px/1 Geist,sans-serif\">Aether<\u002Fspan><\u002Fdiv>\n    <span style=\"font:10.5px 'Geist Mono',monospace;color:var(--ae-t3,rgba(255,255,255,.46))\">Local-first music player · Early access<\u002Fspan>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;font:500 12.5px/1 Geist,sans-serif\">\n      <a href=\"#tour\" style=\"color:var(--ae-t2,rgba(255,255,255,.62))\">The app<\u002Fa>\n      <a href=\"#studio\" style=\"color:var(--ae-t2,rgba(255,255,255,.62))\">Skin Studio<\u002Fa>\n      <a href=\"#roadmap\" style=\"color:var(--ae-t2,rgba(255,255,255,.62))\">Roadmap<\u002Fa>\n      <a href=\"#access\" style=\"color:var(--ae-t2,rgba(255,255,255,.62))\">Early access<\u002Fa>\n      <a href=\"https://github.com/FedericoBaratti/Aether\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ae-t2,rgba(255,255,255,.62))\">GitHub<\u002Fa>\n      <a href=\"https://github.com/FedericoBaratti/Aether/releases\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ae-t2,rgba(255,255,255,.62))\">Releases<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<div data-progress=\"\" style=\"position:fixed;top:0;left:0;height:2px;width:0;background:var(--ae-acc,#8b7cf6);z-index:60;transition:background-color .7s ease\"><\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;skin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;midnight&quot;,&quot;rust&quot;,&quot;chlorophyll&quot;,&quot;paper&quot;],&quot;default&quot;:&quot;midnight&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;ambient&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:5,&quot;default&quot;:70,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nconst SKINS = {\n  midnight: {\n    name: 'Midnight', meta: 'default · 4 effects', file: 'midnight.aeskin', cost: 4,\n    sw: ['#09090d', '#1e1e2a', '#8b7cf6'],\n    v: {\n      '--ae-bg': '#09090d', '--ae-surf': '#0e0e14', '--ae-surf2': '#16161f', '--ae-raise': '#1e1e2a',\n      '--ae-line': 'rgba(255,255,255,.10)', '--ae-t1': 'rgba(255,255,255,.94)', '--ae-t2': 'rgba(255,255,255,.62)',\n      '--ae-t3': 'rgba(255,255,255,.46)', '--ae-acc': '#8b7cf6', '--ae-acc2': '#4fd6e0', '--ae-ink': '#09090d',\n      '--ae-accSoft': 'rgba(139,124,246,.16)', '--ae-glowA': 'rgba(139,124,246,.30)', '--ae-glowB': 'rgba(79,214,224,.20)'\n    },\n    ratios: { t2: 7.1, t3: 4.6, acc: 8.4 }\n  },\n  rust: {\n    name: 'Rust', meta: 'warm · 6 effects', file: 'rust.aeskin', cost: 6,\n    sw: ['#0d0a08', '#241a13', '#d97b3a'],\n    v: {\n      '--ae-bg': '#0d0a08', '--ae-surf': '#141010', '--ae-surf2': '#1c1614', '--ae-raise': '#241a13',\n      '--ae-line': 'rgba(255,232,214,.11)', '--ae-t1': 'rgba(255,244,236,.94)', '--ae-t2': 'rgba(255,236,222,.64)',\n      '--ae-t3': 'rgba(255,232,214,.48)', '--ae-acc': '#d97b3a', '--ae-acc2': '#f2c14e', '--ae-ink': '#180f08',\n      '--ae-accSoft': 'rgba(217,123,58,.18)', '--ae-glowA': 'rgba(217,123,58,.28)', '--ae-glowB': 'rgba(242,193,78,.16)'\n    },\n    ratios: { t2: 7.4, t3: 4.9, acc: 6.8 }\n  },\n  chlorophyll: {\n    name: 'Chlorophyll' g.length].split(',')[1] });\n    const T = [['Weird Fishes / Arpeggi', 'Radiohead', 'In Rainbows', '5:18'], ['Nude', 'Radiohead', 'In Rainbows', '4:15'], ['Teardrop', 'Massive Attack', 'Mezzanine', '5:29'], ['Svefn-g-englar', 'Sigur Rós', 'Ágætis byrjun', '10:04'], ['An Ending (Ascent)', 'Brian Eno', 'Apollo', '4:24'], ['Untrue', 'Burial', 'Untrue', '6:19'], ['Windowlicker', 'Aphex Twin', 'Windowlicker', '6:07'], ['Sea Change', 'Beck', 'Sea Change', '4:41'], ['A Walk', 'Tycho', 'Dive', '5:37'], ['Alice', 'Tom Waits', 'Alice', '4:29'], ['Lift Your Skinny Fists', 'Godspeed', 'Lift Your…', '9:12']];\n\n    return {\n      rows: T.map((r, i) => Object.assign({ n: String(i + 1).padStart(2, '0'), t: r[0], a: r[1], al: r[2], d: r[3] }, pair(i))),\n      bars: Array.from({ length: 28 }, (_, i) => ({ dur: (0.5 + (i % 7) * 0.13).toFixed(2) + 's', del: (i * 0.045).toFixed(2) + 's' })),\n      marquee: Array.from({ length: 2 }).flatMap(() => ['FLAC', 'ALAC', 'WAV', 'AIFF', 'MP3', 'OGG', 'OPUS', 'Gapless playback', 'ReplayGain', 'Cue sheets', 'Embedded art', 'Rust core', '5 000 tracks, no lag', 'No account', 'No telemetry'].map(t => ({ t }))),\n      pillars: [\n        { i: '#a-lock', t: 'Nothing leaves the machine', b: 'No account, no sync, no analytics. Aether opens files, reads their tags, and stops there — the network stack is never touched.' },\n        { i: '#a-bolt', t: 'Dense where it counts', b: '40px rows, air above the list and not between its lines. A library of five thousand tracks scrolls at frame rate, because it is meant to be scrolled.' },\n        { i: '#a-skin', t: 'The markup names its parts', b: 'Every surface the app paints carries a part name. That is what a skin binds to — not a class you guessed from devtools.' },\n        { i: '#a-code', t: 'Two doors per command', b: 'Right-click is never the only way in. Beside it there is always a visible control or an announced shortcut.' }\n      ],\n      chapters: [\n        { t: 'Library', b: 'Navigate on the l xposes no lyric source yet.', p: 'Needs core' },\n        { s: 'Blocked', sc: '#facc15', t: 'Spectrum and equaliser', b: 'viz-screen, eq-bars and eq-slider wait on sample and band access from the audio engine.', p: 'Needs core' },\n        { s: 'Later', sc: 'var(--ae-t3,rgba(255,255,255,.46))', t: 'Android', b: 'bottom-nav is registered but never drawn: the desktop window has an 880px minimum and the rail fits.', p: 'Unscheduled' }\n      ],\n      setRoot: el => { this.root = el; }\n    };\n  }\n\n  componentDidMount() {\n    const root = this.root;\n    if (!root) return;\n    this.applySkin(this.props.skin || 'midnight');\n\n    const amb = Number(this.props.ambient != null ? this.props.ambient : 70) / 100;\n    root.querySelectorAll('[data-amb]').forEach((el, i) => { el.style.opacity = String((i ? 0.6 : 0.75) * amb); });\n    const cg = root.querySelector('[data-cursor-glow]');\n    if (cg) cg.style.opacity = String(0.5 * amb);\n\n    const motion = this.props.motion !== false && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this._motion = motion;\n    this._aurora = root.querySelector('[data-aurora]');\n    this._logo = root.querySelector('[data-logo]');\n    if (this._aurora) this._aurora.style.opacity = String(0.28 * amb);\n\n    // kinetic word-split headline\n    const splits = Array.from(root.querySelectorAll('[data-split]'));\n    splits.forEach(el => {\n      const base = Number(el.getAttribute('data-d')) || 0;\n      const words = (el.textContent || '').trim().split(/\\s+/);\n      el.textContent = '';\n      el.style.perspective = '900px';\n      words.forEach((w, i) => {\n        const mask = document.createElement('span');\n        mask.style.display = 'inline-block';\n        mask.style.overflow = 'hidden';\n        mask.style.verticalAlign = 'bottom';\n        mask.style.padding = '0 0 .08em';\n        const inner = document.createElement('span');\n        inner.textContent = w;\n        inner.setAttribute('data-word', '');\n        inner.style.display = 'inline-block';\n        inner.style.willChange = 'transform';\n        if (motion) {\n          inner.style.transform = 'translateY(108%) rotateX(-62deg) scale(1.12)';\n          inner.style.opacity = '0';\n          inner.style.filter = 'blur(12px)';\n          const d = base + i * 95;\n          inner.style.transition = 'transform 1.15s cubic-bezier(.16,1,.3,1) ' + d + 'ms, opacity .8s ease ' + d + 'ms, filter .9s ease ' + d + 'ms';\n        }\n        mask.appendChild(inner);\n        el.appendChild(mask);\n        if (i < words.length - 1) el.appendChild(document.createTextNode(' '));\n      });\n    });\n    const fireSplit = el => el.querySelectorAll('[data-word]').forEach(w => {\n      w.style.transform = 'none'; w.style.opacity = '1'; w.style.filter = 'none';\n    });\n    if (motion) { requestAnimationFrame(() => requestAnimationFrame(() => splits.forEach(fireSplit))); }\n\n    // reveals\n    const rvs = Array.from(root.querySelectorAll('[data-rv]'));\n    rvs.forEach(el => {\n      const d = el.getAttribute('data-d') || 0;\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(38px) scale(.975)';\n      el.style.filter = 'blur(9px)';\n      el.style.clipPath = 'inset(0 0 12% 0)';\n      el.style.willChange = 'transform,opacity,filter';\n      el.style.transition = 'opacity .9s cubic-bezier(.16,1,.3,1) ' + d + 'ms, transform 1.05s cubic-bezier(.16,1,.3,1) ' + d + 'ms, filter .9s ease ' + d + 'ms, clip-path 1.05s cubic-bezier(.16,1,.3,1) ' + d + 'ms';\n    });\n    const show = el => {\n      el.style.opacity = '1'; el.style.transform = 'none';\n      el.style.filter = 'none'; el.style.clipPath = 'inset(0 0 0 0)';\n      setTimeout(() => { el.style.willChange = 'auto'; el.style.clipPath = 'none'; }, 1600);\n    };\n    if (!motion) { rvs.forEach(show); } else {\n      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } }), { rootMargin: '       c.style.backgroundImage = 'radial-gradient(420px circle at ' + (px * 100) + '% ' + (py * 100) + '%,var(--ae-accSoft,rgba(139,124,246,.16)),transparent 62%)';\n      });\n      c.addEventListener('mouseleave', () => {\n        c.style.transition = 'transform .7s cubic-bezier(.16,1,.3,1),box-shadow .5s ease,background-color .7s ease,border-color .5s ease';\n        c.style.transform = 'none'; c.style.borderColor = 'var(--ae-line,rgba(255,255,255,.08))';\n        c.style.boxShadow = 'none'; c.style.backgroundImage = 'none';\n      });\n    });\n    root.querySelectorAll('[data-magnet]').forEach(m => {\n      m.style.willChange = 'transform';\n      m.addEventListener('mousemove', ev => {\n        if (!motion) return;\n        const b = m.getBoundingClientRect();\n        const dx = (ev.clientX - b.left - b.width / 2) / b.width;\n        const dy = (ev.clientY - b.top - b.height / 2) / b.height;\n        m.style.transition = 'transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease,background-color .7s ease';\n        m.style.transform = 'translate(' + (dx * 16) + 'px,' + (dy * 12 - 3) + 'px) scale(1.07)';\n        m.style.boxShadow = '0 22px 50px -20px var(--ae-glowA,rgba(139,124,246,.45))';\n      });\n      m.addEventListener('mouseleave', () => {\n        m.style.transition = 'transform .8s cubic-bezier(.16,1,.3,1),box-shadow .5s ease,background-color .7s ease';\n        m.style.transform = 'none'; m.style.boxShadow = 'none';\n      });\n    });\n    root.querySelectorAll('[data-road]').forEach(r => {\n      r.addEventListener('mouseenter', () => { r.style.background = 'var(--ae-surf,#0e0e14)'; r.style.paddingLeft = '18px'; });\n      r.addEventListener('mouseleave', () => { r.style.background = 'transparent'; r.style.paddingLeft = '6px'; });\n    });\n\n    // skin picker\n    const picker = root.querySelector('[data-skins]');\n    if (picker) picker.addEventListener('click', ev => {\n      const b = ev.target.closest('[data-skin]');\n      if (!b) return;\n      const r = b.getBoundingClientRect();\n      this.ripple(r.left + r.width / 2, r.top + r.height / 2, b.getAttribute('data-skin'));\n      this.applySkin(b.getAttribute('data-skin'));\n    });\n\n    // waitlist\n    const form = root.querySelector('[data-form]');\n    if (form) form.addEventListener('submit', ev => {\n      ev.preventDefault();\n      const input = root.querySelector('[data-email]');\n      const btn = root.querySelector('[data-submit]');\n      const note = root.querySelector('[data-formnote]');\n      if (!input.value || input.value.indexOf('@') < 0) { input.style.borderColor = '#f87171'; return; }\n      input.style.borderColor = 'var(--ae-line,rgba(255,255,255,.14))';\n      btn.textContent = 'You are in';\n      btn.style.background = '#4ade80';\n      input.disabled = true;\n      note.textContent = 'Wave 1 opens next. We will write once, from a real address.';\n    });\n\n    // scroll\n    const nav = root.querySelector('[data-nav]');\n    const prog = root.querySelector('[data-progress]');\n    const tilt = root.querySelector('[data-hero-tilt]');\n    const heroStage = root.querySelector('[data-hero-stage]');\n    const heroFixed = root.querySelector('[data-hero-fixed]');\n    const tour = root.querySelector('[data-tour]');\n    const screens = Array.from(root.querySelectorAll('[data-tscreen]'));\n    const chapters = Array.from(root.querySelectorAll('[data-chapter]'));\n    const tabs = Array.from(root.querySelectorAll('[data-tab]'));\n    const pars = Array.from(root.querySelectorAll('[data-par]'));\n    let active = -1;\n\n    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n    const setActive = i => {\n      if (i === active) return; active = i;\n      chapters.forEach((c, k) => {\n        c.style.opacity = k === i ? '1' : '0';\n        c.style.transform = k === i ? 'none' : 'translateY(24px)';\n      });\n      tabs.forEach((t, k) => {\n        t.style.background = k === i ? 'var(--ae-acc,#8b7cf6)' : 'transparent';\n
